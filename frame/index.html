<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050506"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>FRAME</title><style>:root{--bg:#050506;--panel:#121214;--muted:#85858d;--text:#f7f7f8;--accent:#d9ff45}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;overscroll-behavior:none}button,input,textarea{font:inherit}button{color:inherit}.app{min-height:100svh;padding-top:env(safe-area-inset-top)}.nav{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:30;background:#050506e8;backdrop-filter:blur(22px)}.logo{font-size:19px;font-weight:950;letter-spacing:-.06em}.logo i{font-style:normal;color:var(--accent)}.navbtn{border:0;background:#18181b;padding:9px 13px;border-radius:999px;font-size:12px}.screen{display:none}.screen.on{display:block}.home{min-height:calc(100svh - 58px);display:flex;flex-direction:column;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}.intro{padding:12px 4px 24px}.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#707077;margin-bottom:13px}.intro h1{font-size:43px;line-height:.93;letter-spacing:-.07em;margin:0;max-width:330px}.intro h1 em{font-style:normal;color:#8f8f96}.picker{position:relative;flex:1;min-height:380px;border-radius:32px;overflow:hidden;background:linear-gradient(145deg,#18181b,#0c0c0e);border:1px solid #ffffff12;box-shadow:0 28px 80px #000}.picker input{position:absolute;inset:0;width:100%;height:100%;opacity:0;z-index:5}.pickerGlow{position:absolute;width:290px;height:290px;border-radius:50%;right:-120px;top:-110px;background:radial-gradient(circle,#d9ff4540 0,transparent 68%)}.pickerGrid{position:absolute;inset:18px;display:grid;grid-template-columns:1.1fr .9fr;grid-template-rows:1fr .72fr;gap:8px;opacity:.34;transform:rotate(-3deg) scale(1.05)}.ph{border-radius:20px;background:linear-gradient(145deg,#34343b,#19191e)}.ph:nth-child(1){grid-row:1/3}.ph:nth-child(3){background:linear-gradient(145deg,#30352a,#151713)}.pickAction{position:absolute;left:20px;right:20px;bottom:20px;z-index:4;height:62px;border-radius:20px;background:#f5f5f6;color:#080809;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:800;font-size:16px;letter-spacing:-.02em;box-shadow:0 16px 40px #0006}.pickAction .plus{width:34px;height:34px;border-radius:50%;background:#0a0a0b;color:#fff;display:grid;place-items:center;font-size:22px;font-weight:300}.privacy{font-size:10px;color:#55555c;text-align:center;margin-top:13px}.loading{position:fixed;inset:0;background:#050506f7;z-index:80;display:none;align-items:center;justify-content:center;flex-direction:column}.loading.on{display:flex}.orb{width:58px;height:58px;border-radius:50%;border:1px solid #ffffff18;position:relative}.orb:after{content:"";position:absolute;inset:7px;border-radius:50%;border-top:2px solid var(--accent);animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.loading b{margin-top:18px;font-size:16px}.loading span{margin-top:6px;color:#686870;font-size:11px}.studioHead{padding:10px 18px 8px;display:flex;align-items:end;justify-content:space-between}.studioHead h2{font-size:25px;letter-spacing:-.055em;margin:0}.studioHead span{font-size:10px;color:#666}.concepts{display:flex;gap:7px;overflow:auto;padding:5px 18px 14px;scrollbar-width:none}.concepts::-webkit-scrollbar{display:none}.pill{border:1px solid #242428;background:#101012;color:#777;border-radius:999px;padding:8px 12px;font-size:11px;white-space:nowrap}.pill.on{background:#f2f2f3;color:#080809;border-color:#f2f2f3;font-weight:750}.canvasWrap{overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:18px;padding:0 18px 18px;scrollbar-width:none}.canvasWrap::-webkit-scrollbar{display:none}.stage{display:flex;width:max-content;gap:10px}.slide{width:calc(100vw - 44px);height:calc((100vw - 44px)*1.25);max-width:370px;max-height:462px;position:relative;overflow:hidden;flex:none;scroll-snap-align:center;background:#eee;border-radius:25px;box-shadow:0 22px 55px #0009}.slide img{position:absolute;object-fit:cover;user-select:none;-webkit-user-drag:none}.textLayer{position:absolute;white-space:pre-wrap;line-height:.92;letter-spacing:-.045em;z-index:30;touch-action:none}.textLayer.sel{outline:1px dashed #fff;outline-offset:5px}.slideNo{position:absolute;right:13px;bottom:11px;z-index:50;font-size:9px;color:#ffffffc9;text-shadow:0 1px 8px #000}.dockSpace{height:104px}.dock{position:fixed;left:16px;right:16px;bottom:calc(10px + env(safe-area-inset-bottom));height:66px;z-index:45;border-radius:24px;background:#18181be8;border:1px solid #ffffff12;backdrop-filter:blur(28px);box-shadow:0 22px 55px #000;display:grid;grid-template-columns:repeat(4,1fr);align-items:center}.tool{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:9px;color:#888;height:100%}.tool .ico{font-size:19px;color:#eee;line-height:1}.tool.export .ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#f4f4f5;color:#080809;font-size:17px}.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#151517;border-top:1px solid #ffffff13;border-radius:30px 30px 0 0;padding:9px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(110%);transition:.26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -30px 80px #000}.sheet.on{transform:translateY(0)}.grab{width:34px;height:4px;border-radius:5px;background:#3b3b40;margin:0 auto 13px}.sheetTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.sheetTop b{font-size:16px}.done{border:0;background:#f3f3f4;color:#080809;border-radius:999px;padding:8px 13px;font-weight:750;font-size:12px}.textInput{width:100%;min-height:78px;border:1px solid #303034;background:#0b0b0d;color:#fff;border-radius:17px;padding:13px;font-size:17px;resize:none}.row{display:flex;gap:7px;overflow:auto;margin-top:11px;scrollbar-width:none}.choice{border:1px solid #2d2d32;background:#0d0d0f;color:#999;border-radius:13px;padding:9px 11px;font-size:11px;white-space:nowrap}.choice.on{background:#eee;color:#111;border-color:#eee}.colors{display:flex;gap:11px;margin-top:13px}.colorDot{width:29px;height:29px;border-radius:50%;border:0}.colorDot.on{outline:2px solid #fff;outline-offset:2px}.range{width:100%;accent-color:#fff;margin-top:14px}.hint{font-size:10px;color:#666;margin-top:8px}.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-15px);background:#f5f5f6;color:#09090b;border-radius:999px;padding:9px 13px;font-size:11px;font-weight:700;z-index:99;opacity:0;transition:.2s;white-space:nowrap}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}@media(min-width:700px){body:before{content:"FRAME está diseñado para iPhone";position:fixed;inset:0;background:#050506;display:grid;place-items:center;z-index:999}}</style></head><body><div class="app"><header class="nav"><div class="logo">FRAM<i>E</i></div><button class="navbtn" id="newBtn" style="display:none">Nuevo</button></header><section id="uploadScreen" class="screen on"><div class="home"><div class="intro"><div class="eyebrow">Personal social studio</div><h1>Tu cámara.<br><em>Mejor compuesta.</em></h1></div><label class="picker"><input id="photos" type="file" accept="image/*" multiple><div class="pickerGlow"></div><div class="pickerGrid"><div class="ph"></div><div class="ph"></div><div class="ph"></div></div><div class="pickAction"><span>Elegir fotos</span><span class="plus">＋</span></div></label><div class="privacy">Privado por diseño · tus fotos se procesan en este dispositivo</div></div></section><section id="resultScreen" class="screen"><div class="studioHead"><h2>Studio</h2><span id="photoCount"></span></div><div class="concepts" id="concepts"></div><div class="canvasWrap" id="canvasWrap"><div class="stage" id="stage"></div></div><div class="dockSpace"></div><div class="dock"><button class="tool" id="remix"><span class="ico">↻</span><span>Layout</span></button><button class="tool" id="addText"><span class="ico">T</span><span>Texto</span></button><button class="tool" id="photoTool"><span class="ico">▧</span><span>Foto</span></button><button class="tool export" id="export"><span class="ico">↑</span><span>Exportar</span></button></div></section></div><div class="sheet" id="textSheet"><div class="grab"></div><div class="sheetTop"><b>Texto</b><button class="done" id="doneText">Listo</button></div><textarea class="textInput" id="textInput" placeholder="Escribe algo…"></textarea><div class="row" id="fonts"><button class="choice on" data-font="sf">Sans</button><button class="choice" data-font="serif">Editorial</button><button class="choice" data-font="mono">Mono</button><button class="choice" data-font="display">Display</button></div><div class="row" id="weights"><button class="choice" data-weight="400">Regular</button><button class="choice on" data-weight="700">Bold</button><button class="choice" data-weight="900">Black</button></div><div class="colors" id="colors"></div><input class="range" id="sizeRange" type="range" min="18" max="82" value="46"><div class="hint">Toca un texto para editarlo. Arrástralo sobre el diseño para moverlo.</div></div><div class="loading" id="loading"><div class="orb"></div><b>Componiendo</b><span>Buscando ritmo entre tus fotos…</span></div><div class="toast" id="toast"></div><script>const $=s=>document.querySelector(s),COLORS=['#ffffff','#111111','#d9ff45','#ff526e','#6680ff','#ffd34e'];let S={photos:[],slides:0,concepts:[],ci:0,sel:null};const uid=()=>Math.random().toString(36).slice(2);function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1500)}function imgSize(){return[340,425]}function loadImage(url){return new Promise((r,j)=>{let i=new Image;i.onload=()=>r(i);i.onerror=j;i.src=url})}$('#photos').onchange=async e=>{let fs=[...e.target.files];if(!fs.length)return;S.photos=fs.map(f=>({id:uid(),url:URL.createObjectURL(f),name:f.name}));S.slides=Math.max(3,Math.min(10,Math.ceil(S.photos.length/1.7)));$('#loading').classList.add('on');await Promise.all(S.photos.slice(0,12).map(p=>loadImage(p.url).catch(()=>null)));setTimeout(()=>{buildConcepts();$('#loading').classList.remove('on');$('#uploadScreen').classList.remove('on');$('#resultScreen').classList.add('on');$('#newBtn').style.display='block';$('#photoCount').textContent=S.photos.length+' fotos · '+S.slides+' slides';renderTabs();render()},500)};function bgFor(s){return[['#f1efe9','#111'],['#111114','#fff'],['#e7e6e2','#111'],['#f5f2eb','#151515'],['#0e1720','#fff']][s%5]}function I(photo,x,y,w,h,z){return{id:uid(),type:'img',photo,x,y,w,h,z}}function T(text,x,y,w,size,color,font,weight){return{id:uid(),type:'text',text,x,y,w,size,color,font,weight,z:90}}function makeConcept(seed){let[W,H]=imgSize(),[bg,ink]=bgFor(seed),L=[];for(let s=0;s<S.slides;s++){let a=S.photos[(s*2+seed)%S.photos.length],b=S.photos[(s*2+1+seed)%S.photos.length],m=(seed+s)%6;if(m===0)L.push(I(a,s*W,0,W,H,s));if(m===1){L.push(I(a,s*W+18,24,W*.72,H*.72,s));if(b)L.push(I(b,s*W+W*.58,H*.59,W*.34,H*.32,s+20))}if(m===2){L.push(I(a,s*W,0,W*.58,H,s));if(b)L.push(I(b,s*W+W*.61,H*.08,W*.34,H*.46,s+10))}if(m===3)L.push(I(a,s*W+W*.16,H*.08,W*.68,H*.84,s));if(m===4){L.push(I(a,s*W,0,W,H*.62,s));if(b)L.push(I(b,s*W+W*.08,H*.68,W*.38,H*.24,s+10))}if(m===5)L.push(I(a,s*W+16,18,W-32,H-36,s))}L.push(T('YOUR TITLE',26,H*.09,W*.82,46,ink,seed%2?'serif':'sf',900));if(S.slides>2)L.push(T('add a note',W+22,H*.78,W*.48,22,seed%2?'#fff':ink,'mono',400));if(S.slides>4)L.push(T('moments / 2026',4*W+22,H*.08,W*.72,18,ink,'sf',700));return{bg,ink,layers:L}}function buildConcepts(){S.concepts=[1,2,3,4,5].map(makeConcept);S.ci=0}function renderTabs(){$('#concepts').innerHTML=S.concepts.map((_,i)=>`<button class="pill ${i===S.ci?'on':''}" data-i="${i}">${['Editorial','Quiet','Gallery','Raw','Night'][i]}</button>`).join('');$('#concepts').onclick=e=>{let b=e.target.closest('.pill');if(!b)return;S.ci=+b.dataset.i;S.sel=null;renderTabs();render()}}function ff(f){return f==='serif'?'Georgia,Times,serif':f==='mono'?'ui-monospace,SFMono-Regular,Menlo,monospace':f==='display'?'Impact,Arial Black,sans-serif':'-apple-system,BlinkMacSystemFont,Arial,sans-serif'}function render(){let[W,H]=imgSize(),c=S.concepts[S.ci],sw=Math.min(innerWidth-44,370),scale=sw/W,html='';for(let s=0;s<S.slides;s++){html+=`<div class="slide" data-slide="${s}" style="background:${c.bg}">`;for(const l of c.layers.filter(l=>l.x+l.w>s*W&&l.x<(s+1)*W).sort((a,b)=>a.z-b.z)){let lx=(l.x-s*W)*scale;if(l.type==='img')html+=`<img src="${l.photo.url}" style="left:${lx}px;top:${l.y*scale}px;width:${l.w*scale}px;height:${l.h*scale}px;z-index:${l.z}">`;else html+=`<div class="textLayer ${S.sel===l.id?'sel':''}" data-id="${l.id}" style="left:${lx}px;top:${l.y*scale}px;width:${l.w*scale}px;font-size:${l.size*scale}px;color:${l.color};font-family:${ff(l.font)};font-weight:${l.weight}">${esc(l.text)}</div>`}html+=`<div class="slideNo">${String(s+1).padStart(2,'0')}</div></div>`}$('#stage').innerHTML=html;bindText()}function esc(t){return t.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function selected(){return S.concepts[S.ci]?.layers.find(l=>l.id===S.sel)}function bindText(){document.querySelectorAll('.textLayer').forEach(el=>{let sx,sy,ox,oy,moved=false;el.addEventListener('pointerdown',e=>{let l=S.concepts[S.ci].layers.find(x=>x.id===el.dataset.id);if(!l)return;S.sel=l.id;sx=e.clientX;sy=e.clientY;ox=l.x;oy=l.y;moved=false;el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!S.sel)return;let l=selected();if(!l)return;let scale=Math.min(innerWidth-44,370)/340,dx=(e.clientX-sx)/scale,dy=(e.clientY-sy)/scale;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;l.x=ox+dx;l.y=Math.max(0,Math.min(405,l.y+dy));render()});el.addEventListener('pointerup',()=>{if(!moved)openText(el.dataset.id)})})}function openText(id){S.sel=id;let l=selected();if(!l)return;$('#textInput').value=l.text;$('#sizeRange').value=l.size;document.querySelectorAll('#fonts .choice').forEach(x=>x.classList.toggle('on',x.dataset.font===l.font));document.querySelectorAll('#weights .choice').forEach(x=>x.classList.toggle('on',+x.dataset.weight===l.weight));renderColors();$('#textSheet').classList.add('on');render()}function renderColors(){$('#colors').innerHTML=COLORS.map(c=>`<button class="colorDot ${selected()?.color===c?'on':''}" data-c="${c}" style="background:${c}"></button>`).join('')}$('#textInput').oninput=e=>{let l=selected();if(l){l.text=e.target.value;render()}};$('#sizeRange').oninput=e=>{let l=selected();if(l){l.size=+e.target.value;render()}};$('#fonts').onclick=e=>{let b=e.target.closest('.choice'),l=selected();if(!b||!l)return;l.font=b.dataset.font;openText(l.id)};$('#weights').onclick=e=>{let b=e.target.closest('.choice'),l=selected();if(!b||!l)return;l.weight=+b.dataset.weight;openText(l.id)};$('#colors').onclick=e=>{let b=e.target.closest('.colorDot'),l=selected();if(!b||!l)return;l.color=b.dataset.c;renderColors();render()};$('#doneText').onclick=()=>{$('#textSheet').classList.remove('on');S.sel=null;render()};$('#addText').onclick=()=>{let[W,H]=imgSize(),s=Math.round($('#canvasWrap').scrollLeft/(Math.min(innerWidth-44,370)+10)),l=T('NEW TEXT',s*W+24,H*.5,W*.72,34,'#ffffff','sf',700);S.concepts[S.ci].layers.push(l);openText(l.id)};$('#remix').onclick=()=>{S.concepts[S.ci]=makeConcept(Math.floor(Math.random()*40)+1);render();toast('Nuevo layout')};$('#photoTool').onclick=()=>toast('Desliza para cambiar de slide');$('#newBtn').onclick=()=>location.reload();function canvasBlob(cv){return new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(),'image/png'))}function wrap(ctx,t,x,y,w,lh){let words=t.split(' '),line='';for(let q of words){let z=line+q+' ';if(ctx.measureText(z).width>w&&line){ctx.fillText(line,x,y);line=q+' ';y+=lh}else line=z}ctx.fillText(line,x,y)}async function makeSlides(){let[W,H]=[1080,1350],[bw,bh]=imgSize(),ratio=W/bw,c=S.concepts[S.ci],out=[];for(let p=0;p<S.slides;p++){let cv=document.createElement('canvas');cv.width=W;cv.height=H;let x=cv.getContext('2d');x.fillStyle=c.bg;x.fillRect(0,0,W,H);for(const l of c.layers.filter(l=>l.x+l.w>p*bw&&l.x<(p+1)*bw).sort((a,b)=>a.z-b.z)){let lx=(l.x-p*bw)*ratio;if(l.type==='img'){let im=await loadImage(l.photo.url);x.save();x.beginPath();x.rect(lx,l.y*ratio,l.w*ratio,l.h*ratio);x.clip();let ir=im.width/im.height,br=l.w/l.h,dx=lx,dy=l.y*ratio,dw=l.w*ratio,dh=l.h*ratio;if(ir>br){dw=dh*ir;dx+=(l.w*ratio-dw)/2}else{dh=dw/ir;dy+=(l.h*ratio-dh)/2}x.drawImage(im,dx,dy,dw,dh);x.restore()}else{x.fillStyle=l.color;x.font=`${l.weight} ${Math.round(l.size*ratio)}px ${l.font==='serif'?'Georgia':l.font==='mono'?'Menlo':l.font==='display'?'Impact':'Arial'}`;x.textBaseline='top';wrap(x,l.text,lx,l.y*ratio,l.w*ratio,l.size*ratio*.92)}}let blob=await canvasBlob(cv);out.push(new File([blob],`FRAME_${String(p+1).padStart(2,'0')}.png`,{type:'image/png'}))}return out}$('#export').onclick=async()=>{try{toast('Preparando…');let files=await makeSlides();if(navigator.share&&(!navigator.canShare||navigator.canShare({files}))){await navigator.share({files,title:'FRAME'});return}for(const f of files){let a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}toast('Listo')}catch(e){if(e.name!=='AbortError')toast('No se pudo exportar')}};</script></body></html>
