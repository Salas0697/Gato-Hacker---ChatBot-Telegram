<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0d"><meta name="apple-mobile-web-app-capable" content="yes"><title>FRAME — Social Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,Inter,Arial,sans-serif}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#0b0b0df2;border-bottom:1px solid #29292f}.brand{font-weight:900;letter-spacing:-.04em}.brand small{display:block;font-size:8px;color:#85858e;letter-spacing:.16em}.btn{border:1px solid #303038;background:#17171c;color:#fff;padding:9px 12px;border-radius:12px}.primary{background:#fff;color:#111;font-weight:800}.layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 58px)}aside{padding:16px;border-right:1px solid #29292f;background:#0f0f12;overflow:auto}main{min-width:0;overflow:auto}.section{padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid #29292f}.label{font-size:10px;color:#8a8a94;text-transform:uppercase;letter-spacing:.12em;margin-bottom:9px}.field{width:100%;background:#19191f;border:1px solid #303038;color:#fff;padding:10px;border-radius:11px;margin-bottom:8px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid #303038;background:#17171c;color:#b9b9c2;padding:7px 9px;border-radius:999px;font-size:11px}.chip.on{background:#fff;color:#111;font-weight:800}.upload{display:block;text-align:center;border:1px dashed #41414a;padding:12px;border-radius:12px;color:#aaa;cursor:pointer}.upload input{display:none}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}.gen{width:100%;border:0;background:#ff3b30;color:#fff;font-weight:900;padding:13px;border-radius:12px}.workspace{padding:18px}.toolbar{display:flex;gap:8px;align-items:center;overflow:auto;margin-bottom:16px}.concept{white-space:nowrap}.concept.on{background:#fff;color:#111}.stage{display:flex;gap:0;width:max-content;max-width:none;box-shadow:0 20px 60px #0008}.slide{position:relative;overflow:hidden;background:#eee;border-right:1px solid #ffffff55;flex:0 0 auto}.slide img{position:absolute;object-fit:cover}.txt{position:absolute;white-space:pre-wrap;line-height:.92;letter-spacing:-.04em}.empty{padding:14vh 20px;text-align:center;color:#777}.empty b{display:block;color:#fff;font-size:24px;margin-bottom:8px}.inspector{position:sticky;bottom:0;background:#111116ed;border-top:1px solid #2c2c33;padding:10px;display:flex;gap:8px;overflow:auto}.inspector .field{min-width:130px;margin:0}.sw{display:flex;gap:7px;align-items:center}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#fff;color:#111;padding:9px 13px;border-radius:999px;opacity:0;transition:.2s;z-index:50;font-size:12px}.toast.show{opacity:1}@media(max-width:820px){.layout{display:block}.top{height:54px}aside{border-right:0;border-bottom:1px solid #29292f}.workspace{padding:12px}.stage{transform-origin:top left}.inspector{position:fixed;left:0;right:0;bottom:0;z-index:30}.workspace{padding-bottom:86px}}</style></head><body><div class="top"><div class="brand">FRAME<small>SOCIAL STUDIO</small></div><div><button class="btn" id="remix">Remix</button> <button class="btn primary" id="export">Export</button></div></div><div class="layout"><aside><div class="section"><div class="label">Contenido</div><input class="field" id="title" placeholder="Título / frase principal"><textarea class="field" id="caption" rows="3" placeholder="Qué quieres comunicar"></textarea><label class="upload">+ Subir fotos<input id="photos" type="file" accept="image/*" multiple></label><div class="thumbs" id="thumbs"></div></div><div class="section"><div class="label">Formato</div><div class="chips" id="formats"><button class="chip on" data-v="45">Post 4:5</button><button class="chip" data-v="11">Cuadrado</button><button class="chip" data-v="916">Story</button></div><label style="font-size:11px;color:#aaa">Slides</label><input class="field" id="slides" type="number" min="1" max="20" value="6"></div><div class="section"><div class="label">Vibe</div><div class="chips" id="styles"></div></div><div class="section"><div class="label">Dirección artística</div><textarea class="field" id="direction" rows="4" placeholder="Ej. Editorial, espontáneo, mucho espacio negativo, nada cursi..."></textarea><div class="chips" id="energy"><button class="chip" data-v="clean">Clean</button><button class="chip on" data-v="dynamic">Dynamic</button><button class="chip" data-v="chaotic">Chaotic</button></div></div><button class="gen" id="generate">✨ Generar layouts</button></aside><main><div class="workspace"><div class="toolbar" id="concepts"></div><div id="canvas"><div class="empty"><b>Tu estudio creativo.</b>Sube fotos, elige una vibe y genera varias direcciones visuales.</div></div></div><div class="inspector" id="inspector" style="display:none"><input class="field" id="editText" placeholder="Editar texto"><input class="field" id="fontSize" type="number" min="12" max="240" placeholder="Tamaño"><input class="field" id="color" type="color" value="#ffffff"><button class="btn" id="delete">Eliminar</button></div></main></div><div class="toast" id="toast"></div><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const STYLES=['Editorial','Magazine','Minimal','Photo dump','Experimental','Luxury','Film','Y2K','Bold'];let S={format:'45',slides:6,style:'Editorial',energy:'dynamic',photos:[],concepts:[],ci:0,sel:null};let uid=()=>Math.random().toString(36).slice(2);let toast=t=>{let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)};STYLES.forEach((x,i)=>$('#styles').insertAdjacentHTML('beforeend',`<button class="chip ${i?'':'on'}" data-v="${x}">${x}</button>`));function bindGroup(id,key){$('#'+id).onclick=e=>{let b=e.target.closest('.chip');if(!b)return;$('#'+id).querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');S[key]=b.dataset.v}}bindGroup('formats','format');bindGroup('styles','style');bindGroup('energy','energy');$('#photos').onchange=async e=>{S.photos=[];for(const f of [...e.target.files]){let url=URL.createObjectURL(f);S.photos.push({id:uid(),url,name:f.name})}$('#thumbs').innerHTML=S.photos.map(p=>`<img src="${p.url}">`).join('');toast(S.photos.length+' fotos cargadas')};function size(){return S.format==='916'?[270,480]:S.format==='11'?[360,360]:[360,450]}function palette(){let p={Editorial:['#f2efe8','#111','#e33'],Magazine:['#f3eee4','#111','#d11'],Minimal:['#fff','#101014','#888'],'Photo dump':['#111','#fff','#ffce44'],Experimental:['#d9ff3f','#111','#ff4bca'],Luxury:['#16120e','#f2e5cf','#b99a64'],Film:['#e8dfcf','#231f1a','#9d2c20'],Y2K:['#d6dcff','#161621','#ff4aa2'],Bold:['#ff3b30','#fff','#111']};return p[S.style]||p.Editorial}function concept(seed){let [W,H]=size(),P=palette(),layers=[];let n=Math.min(S.photos.length,Math.max(S.slides*2,4));for(let i=0;i<n;i++){let p=S.photos[(i+seed)%Math.max(1,S.photos.length)];if(!p)break;let page=i%S.slides,r=(seed+i*7)%5,x=page*W,y=0,w=W,h=H;if(r===1){w=W*.56;h=H*.6;x=page*W+W*.06;y=H*.08}if(r===2){w=W*.72;h=H*.48;x=page*W+W*.2;y=H*.44}if(r===3&&page<S.slides-1){w=W*1.32;h=H*.62;x=page*W+W*.42;y=H*.18}if(r===4){w=W*.46;h=H*.72;x=page*W+W*.48;y=H*.12}layers.push({id:uid(),type:'img',photo:p,x,y,w,h,z:i})}let t=$('#title').value.trim();if(t){for(let s=0;s<S.slides;s+=Math.max(2,Math.floor(S.slides/3))){layers.push({id:uid(),type:'text',text:t,x:s*W+W*.08,y:H*(.08+((s+seed)%3)*.24),w:W*.84,size:S.style==='Minimal'?34:52,color:P[(s+seed)%2],z:99})}}return {bg:P[0],layers}}function generate(){S.slides=Math.max(1,Math.min(20,+$('#slides').value||6));S.concepts=[1,2,3,4,5,6].map((_,i)=>concept(i*3+1));S.ci=0;renderConcepts();render();toast('6 conceptos generados')}$('#generate').onclick=generate;function renderConcepts(){$('#concepts').innerHTML=S.concepts.map((c,i)=>`<button class="btn concept ${i===S.ci?'on':''}" data-i="${i}">Concept ${String.fromCharCode(65+i)}</button>`).join('');$('#concepts').onclick=e=>{let b=e.target.closest('.concept');if(!b)return;S.ci=+b.dataset.i;renderConcepts();render()}}function render(){if(!S.concepts.length)return;let [W,H]=size(),c=S.concepts[S.ci],scale=window.innerWidth<820?Math.min(.72,(window.innerWidth-24)/(W*Math.min(S.slides,2))):.78;let html=`<div class="stage" style="transform:scale(${scale});margin-bottom:${-(H*(1-scale))}px">`;for(let s=0;s<S.slides;s++){html+=`<div class="slide" data-s="${s}" style="width:${W}px;height:${H}px;background:${c.bg}">`;for(const l of c.layers.filter(l=>l.x+l.w>s*W&&l.x<(s+1)*W).sort((a,b)=>a.z-b.z)){let lx=l.x-s*W;if(l.type==='img')html+=`<img data-id="${l.id}" src="${l.photo.url}" style="left:${lx}px;top:${l.y}px;width:${l.w}px;height:${l.h}px;z-index:${l.z}">`;else html+=`<div class="txt" data-id="${l.id}" style="left:${lx}px;top:${l.y}px;width:${l.w}px;font-size:${l.size}px;color:${l.color};z-index:${l.z};font-family:${S.style==='Editorial'||S.style==='Luxury'?'Georgia,serif':'inherit'}">${esc(l.text)}</div>`}html+='</div>'}html+='</div>';$('#canvas').innerHTML=html;$('#canvas').onclick=e=>{let id=e.target.dataset.id;if(!id)return;S.sel=id;inspect()}}function esc(t){return t.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function inspect(){let l=S.concepts[S.ci].layers.find(x=>x.id===S.sel);if(!l){$('#inspector').style.display='none';return}$('#inspector').style.display='flex';$('#editText').style.display=l.type==='text'?'block':'none';$('#fontSize').style.display=l.type==='text'?'block':'none';$('#color').style.display=l.type==='text'?'block':'none';if(l.type==='text'){$('#editText').value=l.text;$('#fontSize').value=l.size;$('#color').value=l.color}}$('#editText').oninput=e=>{let l=S.concepts[S.ci].layers.find(x=>x.id===S.sel);if(l){l.text=e.target.value;render();inspect()}};$('#fontSize').oninput=e=>{let l=S.concepts[S.ci].layers.find(x=>x.id===S.sel);if(l){l.size=+e.target.value;render();inspect()}};$('#color').oninput=e=>{let l=S.concepts[S.ci].layers.find(x=>x.id===S.sel);if(l){l.color=e.target.value;render();inspect()}};$('#delete').onclick=()=>{let c=S.concepts[S.ci];c.layers=c.layers.filter(x=>x.id!==S.sel);S.sel=null;render();inspect()};$('#remix').onclick=()=>{if(!S.concepts.length)return generate();S.concepts[S.ci]=concept(Math.floor(Math.random()*99));render();toast('Remix listo')};async function exportSlides(){if(!S.concepts.length){toast('Genera primero');return}let [W,H]=S.format==='916'?[1080,1920]:S.format==='11'?[1080,1080]:[1080,1350],base=size(),ratio=W/base[0],c=S.concepts[S.ci];for(let s=0;s<S.slides;s++){let cv=document.createElement('canvas');cv.width=W;cv.height=H;let x=cv.getContext('2d');x.fillStyle=c.bg;x.fillRect(0,0,W,H);for(const l of c.layers.filter(l=>l.x+l.w>s*base[0]&&l.x<(s+1)*base[0]).sort((a,b)=>a.z-b.z)){let lx=(l.x-s*base[0])*ratio;if(l.type==='img'){let im=new Image();im.src=l.photo.url;await im.decode();x.save();x.beginPath();x.rect(lx,l.y*ratio,l.w*ratio,l.h*ratio);x.clip();let ir=im.width/im.height,br=l.w/l.h,dx=lx,dy=l.y*ratio,dw=l.w*ratio,dh=l.h*ratio;if(ir>br){dw=dh*ir;dx+=((l.w*ratio)-dw)/2}else{dh=dw/ir;dy+=((l.h*ratio)-dh)/2}x.drawImage(im,dx,dy,dw,dh);x.restore()}else{x.fillStyle=l.color;x.font=`${Math.round(l.size*ratio)}px ${S.style==='Editorial'||S.style==='Luxury'?'Georgia':'Arial'}`;x.textBaseline='top';wrap(x,l.text,lx,l.y*ratio,l.w*ratio,l.size*ratio*.92)}}let a=document.createElement('a');a.download=`FRAME_${String(s+1).padStart(2,'0')}.png`;a.href=cv.toDataURL('image/png');a.click();await new Promise(r=>setTimeout(r,250))}toast('Exportación lista')}function wrap(ctx,t,x,y,w,lh){let words=t.split(' '),line='';for(const word of words){let test=line+word+' ';if(ctx.measureText(test).width>w&&line){ctx.fillText(line,x,y);line=word+' ';y+=lh}else line=test}ctx.fillText(line,x,y)}$('#export').onclick=exportSlides;window.addEventListener('resize',()=>S.concepts.length&&render());</script></body></html>
