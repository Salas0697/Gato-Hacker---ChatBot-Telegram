<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070708"><title>FRAME Director</title><style>html,body{margin:0;background:#070708;color:#f4f4f6;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;height:100%}.boot{height:100%;display:grid;place-items:center}.boot div{text-align:center}.dot{width:42px;height:42px;border-radius:50%;border:1px solid #333;border-top:2px solid #d9ff45;margin:0 auto 14px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#777}</style></head><body><div class="boot"><div><div class="dot"></div><b>FRAME Director</b><br><small>Cargando dirección de arte…</small></div></div><script>(async()=>{try{const parts=[];for(let i=0;i<8;i++){const r=await fetch(`./director/${i}.txt?v=8`);if(!r.ok)throw new Error('director chunk '+i);parts.push((await r.text()).trim())}const b64=parts.join('');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);let html=new TextDecoder('utf-8').decode(bytes);html=html.replace('</body>','<script src="./director-enhancements.js?v=8"><\/script></body>');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="boot"><div><b>No pude cargar FRAME Director</b><br><small>'+e.message+'</small></div></div>'}})();</script></body></html>
